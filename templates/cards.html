<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Все карты</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="game-container">
        <h1>📜 Список всех карт</h1>

        <table class="card-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Атака</th>
                    <th>Здоровье</th>
                    <th>Стоимость</th>
                </tr>
            </thead>
            <tbody>
                {% for card in cards %}
                <tr>
                    <td>{{ card[0] }}</td>
                    <td>{{ card[1] }}</td>
                    <td>{{ card[2] }}</td>
                    <td>{{ card[3] }}</td>
                    <td>{{ card[4] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="controls">
            <a href="{{ url_for('home') }}" class="control-button">⬅️ Назад в игру</a>
        </div>
    </div>
</body>
</html>
