<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Присоединиться к лобби | Card Battle</title>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="game-container menu-container fade-in">
        <div class="menu-header">
            <h1 class="title pulse">Присоединиться к лобби</h1>
        </div>

        <form method="post"
              action="{{ url_for('join_lobby') }}"
              class="menu-cards"
              style="align-items: center;">
            <label for="lobby_code"
                   class="menu-card-desc"
                   style="font-size: 1.2rem;">Введите код лобби:</label>
            <input type="text"
                   id="lobby_code"
                   name="lobby_code"
                   required class="control-button"
                   style="padding: 0.5rem 1rem; font-size: 1rem; margin-bottom: 1rem;">
            <button type="submit"
                    class="control-button">Подключиться</button>
        </form>
    </div>
</body>
</html>
