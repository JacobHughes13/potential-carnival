<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Присоединиться к лобби | Card Battle</title>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap">
  <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="game-container menu-container fade-in">
    <div class="menu-header">
      <h1 class="title pulse">Присоединиться к лобби</h1>
    </div>

    <form class="menu-cards"
          style="align-items:center;"
          id="join-form">
      <label for="lobby_code"
             class="menu-card-desc"
             style="font-size:1.2rem;">
        Введите код лобби:
      </label>
      <input type="text"
             id="lobby_code"
             name="lobby_code"
             class="control-button"
             style="padding:0.5rem 1rem;font-size:1rem;margin-bottom:1rem;"
             required>
      <button type="submit"
              class="control-button">Подключиться</button>
    </form>
  </div>

  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script>
    const socket = io();

    document.getElementById('join-form').addEventListener('submit', e => {
      e.preventDefault();
      const code = document.getElementById('lobby_code').value.trim().toUpperCase();
      if (code) {
        socket.emit('join_room', { room: code });   // становимся гостем
      }
    });

    /* Когда оба игрока готовы, сервер шлёт game_start */
    socket.on('game_start', data => {
      window.location.href = `/game/${data.room}`;
    });

    socket.on('error', data => {
      alert(data.message);
      window.location.reload();
    });
  </script>
</body>
</html>
