<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лобби | 🧠 BRAINROT BATTLE 🧠</title>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body>
  <h1>Привет, {{ username }}!</h1>

  <a href="{{ url_for('create_lobby') }}">
    <button>Создать комнату</button>
  </a>
  <br><br>

  <input type="text"
         id="roomCode"
         placeholder="Введите код комнаты">
  <button onclick="joinRoom()">Присоединиться</button>

  <div id="lobbyStatus"></div>

  <script>
    const socket = io();

    function joinRoom() {
      const code = document.getElementById('roomCode').value.trim().toUpperCase();
      if (code) socket.emit('join_room', { room: code });
    }

    socket.on('room_joined', data => {
      document.getElementById('lobbyStatus').innerText =
        `Вы в комнате: ${data.room}\nУчастники: ${data.users.join(', ')}`;
    });

    socket.on('error', data => alert(data.message));

    /* Когда гостя приняли, а хост уже в комнате, сервер шлёт game_start  */
    socket.on('game_start', data => {
      window.location.href = `/game/${data.room}`;
    });
  </script>
</body>
</html>
