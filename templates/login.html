<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход | 🧠 BRAINROT BATTLE 🧠</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="game-container auth-container fade-in">
        <div class="auth-header">
            <h1 class="auth-title">Вход в игру</h1>
            <p class="auth-subtitle">Войдите, чтобы продолжить свое приключение</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="auth-form">
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder=" " required>
                <label for="username">Имя пользователя</label>
            </div>

            <div class="input-group">
                <input type="password" id="password" name="password" placeholder=" " required>
                <label for="password">Пароль</label>
            </div>

            <button type="submit" class="auth-button">Войти в аккаунт</button>
        </form>

        <div class="auth-links">
            <p>Нет аккаунта? <a href="{{ url_for('register') }}" class="auth-link">Зарегистрироваться</a></p>
            <a href="{{ url_for('main_menu') }}" class="auth-link">← Вернуться на главную</a>
        </div>
    </div>
</body>
</html>
