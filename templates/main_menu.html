<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главное меню</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 class="title pulse">⚔️ CARD BATTLE ⚔️</h1>
            <div class="user-greeting">
                {% if username %}
                    <p>Добро пожаловать, <strong>{{ username }}</strong></p>
                {% else %}
                    <p>Добро пожаловать, Гость</p>
                {% endif %}
            </div>
        </div>

        <div class="menu-buttons">
            <a href="{{ url_for('play') }}" class="menu-button">🎮 Начать игру</a>
            <a href="{{ url_for('friends') }}" class="menu-button">👥 Друзья</a>
            <a href="{{ url_for('settings') }}" class="menu-button">⚙️ Настройки</a>
            {% if username %}
                <a href="{{ url_for('logout') }}" class="menu-button">🚪 Выйти</a>
            {% else %}
                <a href="{{ url_for('login') }}" class="menu-button">🔑 Войти</a>
                <a href="{{ url_for('register') }}" class="menu-button">📝 Регистрация</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
