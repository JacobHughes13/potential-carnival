<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="game-container">
        <h1>📝 Регистрация</h1>

        <form action="{{ url_for('register') }}"
              method="POST"
              class="auth-form">
            <input type="text"
                   name="username"
                   placeholder="Имя пользователя"
                   required>
            <input type="password"
                   name="password"
                   placeholder="Пароль"
                   required>
            <input type="password"
                   name="confirm_password"
                   placeholder="Повторите пароль"
                   required>

            <button type="submit"
                    class="control-button">Создать аккаунт</button>
        </form>

        <div class="auth-links">
            <p>Уже есть аккаунт?
                <a href="{{ url_for('login') }}">Войти</a>
            </p>
            <a href="{{ url_for('home') }}">⬅️ На главную</a>
        </div>
    </div>
</body>
</html>
