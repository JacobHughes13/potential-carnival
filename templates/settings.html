<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Настройки</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="game-container menu-container fade-in"
     style="max-width:600px;">
    <h1 class="title">⚙️ Настройки</h1>

    <div style="text-align:left;">
        <label for="volume">Громкость музыки: <span id="vol-val">50</span>%</label>
        <input type="range" id="volume" min="0" max="100" value="50">
    </div>

    <div style="margin-top:15px;">
        <label>
            <input type="checkbox" id="music-toggle" checked>
            Включить музыку
        </label>
    </div>

    <a href="{{ url_for('main_menu') }}"
       class="control-button"
       style="margin-top:20px;">Назад</a>
</div>

<audio id="bg-music"
       loop src="{{ url_for('static', filename='music/background.mp3') }}"></audio>

<script>
    const slider  = document.getElementById('volume');
    const toggle  = document.getElementById('music-toggle');
    const val     = document.getElementById('vol-val');

    slider.value  = localStorage.getItem('vol') * 100 || 50;
    toggle.checked = !(JSON.parse(localStorage.getItem('muted') ?? 'false'));
    val.textContent = slider.value;

    slider.oninput = () => {
        const v = slider.value/100;
        val.textContent = slider.value;
        window.dispatchEvent(new CustomEvent('music:set-volume',{detail:v}));
    };
    toggle.onchange = () => window.dispatchEvent(new Event('music:toggle'));
</script>
</body>
</html>
